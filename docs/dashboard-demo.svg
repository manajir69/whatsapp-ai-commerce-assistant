<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><title>WhatsApp AI Commerce Assistant — illustrative dashboard with fictional data</title><rect width="1440" height="900" fill="#f3f5f1"/><style>text{font-family:Arial,sans-serif;fill:#203b34}.muted{fill:#728078}.small{font-size:14px}.body{font-size:17px}.label{font-size:12px;letter-spacing:2px;font-weight:700}.h{font-size:28px;font-weight:700}</style><rect x="28" y="28" width="1384" height="844" rx="24" fill="#fff"/><rect x="28" y="28" width="252" height="844" rx="24" fill="#173f35"/><text x="55" y="90" class="h" style="fill:#d7ecbb">DC</text><text x="108" y="75" class="label" style="fill:#fff">DEMO COMMERCE</text><text x="108" y="99" class="small" style="fill:#a9c3b8;font-size:12px">WHATSAPP WORKSPACE</text><text x="55" y="165" class="label" style="fill:#8bafa1">CONTROL ROOM</text><text x="66" y="210" class="body" style="fill:#d0dfd8">Overview</text><rect x="45" y="243" width="218" height="45" rx="11" fill="#d8e9c7"/><text x="66" y="270" class="body" style="fill:#173f35">Conversations</text><text x="66" y="330" class="body" style="fill:#d0dfd8">Ticket inbox</text><text x="66" y="390" class="body" style="fill:#d0dfd8">Customers</text><text x="66" y="450" class="body" style="fill:#d0dfd8">Owner stock</text><text x="66" y="510" class="body" style="fill:#d0dfd8">Knowledge base</text><text x="66" y="570" class="body" style="fill:#d0dfd8">AI &amp; instructions</text><text x="66" y="630" class="body" style="fill:#d0dfd8">Connections &amp; health</text><text x="56" y="818" class="label" style="fill:#b0c8b9">PORTFOLIO EDITION</text><text x="56" y="843" class="small" style="fill:#b0c8b9">Fictional demonstration data</text><text x="317" y="81" class="label">CUSTOMER SUPPORT / COMMERCE</text><text x="317" y="125" class="h">Conversations</text><text x="317" y="157" class="body">Context-aware answers, with a person always in control.</text><rect x="1125" y="86" width="239" height="38" rx="19" fill="#edf3e5"/><text x="1146" y="110" class="label">ILLUSTRATIVE INTERFACE</text><rect x="316" y="193" width="1048" height="51" rx="10" fill="#f4f6f2"/><text x="336" y="225" class="body">Search names, numbers, or conversation words…</text><rect x="316" y="268" width="279" height="491" rx="15" fill="#f5f7f3"/><rect x="328" y="287" width="255" height="101" rx="12" fill="#e6eddd"/><text x="345" y="316" class="body">Alex Morgan</text><text x="345" y="345" class="small">Is the oak panel available?</text><text x="345" y="368" class="small">02 Nov · 10:15 AM</text><rect x="547" y="297" width="25" height="25" rx="13" fill="#df3c36"/><text x="555" y="315" class="small" style="fill:#fff">2</text><rect x="328" y="402" width="255" height="101" rx="12" fill="#fff"/><text x="345" y="431" class="body">Robin Lee</text><text x="345" y="460" class="small">Delivery options for my order</text><text x="345" y="483" class="small">02 Nov · 10:15 AM</text><rect x="547" y="412" width="25" height="25" rx="13" fill="#df3c36"/><text x="555" y="430" class="small" style="fill:#fff">1</text><rect x="328" y="517" width="255" height="101" rx="12" fill="#fff"/><text x="345" y="546" class="body">Taylor Reed</text><text x="345" y="575" class="small">Thanks for the update.</text><text x="345" y="598" class="small">02 Nov · 10:15 AM</text><text x="333" y="707" class="small">Demo contacts only</text><rect x="616" y="268" width="748" height="491" rx="15" fill="#fff"/><text x="639" y="300" class="body">Alex Morgan</text><text x="639" y="325" class="small">Product enquiry · Sample oak wall panel</text><path d="M639 343H1340" stroke="#e1e8dd"/><rect x="640" y="366" width="539" height="88" rx="14" fill="#f0f2ea"/><text x="658" y="392" class="label">CUSTOMER</text><text x="658" y="421" class="body">Is the oak panel in stock? I need 4 pieces.</text><text x="658" y="442" class="small">10:15 AM</text><rect x="778" y="471" width="562" height="95" rx="14" fill="#e4edd9"/><text x="797" y="496" class="label">ASSISTANT</text><text x="797" y="524" class="body">We are checking availability and will let you know.</text><text x="797" y="548" class="small">10:15 AM · Delivered</text><rect x="640" y="587" width="700" height="151" rx="12" fill="#f5f7f0"/><text x="658" y="613" class="label">YOUR VERIFIED ANSWER</text><rect x="657" y="627" width="664" height="47" rx="8" fill="#fff"/><text x="671" y="656" class="body">4 pieces are available.</text><rect x="657" y="688" width="212" height="34" rx="8" fill="#17664f"/><text x="672" y="711" class="small" style="fill:#fff">Send &amp; pause assistant</text><rect x="882" y="688" width="192" height="34" rx="8" fill="#e4ebdd"/><text x="899" y="711" class="small">Send exactly as written</text><rect x="316" y="784" width="1048" height="57" rx="12" fill="#173f35"/><text x="339" y="819" class="body" style="fill:#e9f2e6">AI routing  →  verified stock / knowledge  →  human escalation  →  delivery tracking</text></svg>